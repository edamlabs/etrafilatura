#  tach · architectural import contracts (Rust-backed) · CI: `tach check` (make arch)
#  Layers mirror trafilatura's own module graph: settings/utils/errors (contracts)
#  ← deduplication/xml/htmlprocessing (renderers) ← downloads/baseline/metadata (engines)
#  ← core/cli (use cases) ← etrafilatura (public surface).

source_roots = ["src"]

exclude = ["tests", "docs"]

forbid_circular_dependencies = true

exact = true

root_module = "forbid"

[rules]
unused_ignore_directives = "error"

[[modules]]
path = "etrafilatura"
depends_on = [
    "etrafilatura._native",
    "etrafilatura.baseline",
    "etrafilatura.core",
    "etrafilatura.downloads",
    "etrafilatura.metadata",
    "etrafilatura.utils",
]

[[modules]]
path = "etrafilatura._native"
depends_on = []

[[modules]]
path = "etrafilatura.errors"
depends_on = []

[[modules]]
path = "etrafilatura.utils"
depends_on = ["etrafilatura._native"]

[[modules]]
path = "etrafilatura.settings"
depends_on = ["etrafilatura.utils"]

[[modules]]
path = "etrafilatura.deduplication"
depends_on = ["etrafilatura.settings", "etrafilatura.utils"]

[[modules]]
path = "etrafilatura.xml"
depends_on = ["etrafilatura.settings", "etrafilatura.utils"]

[[modules]]
path = "etrafilatura.htmlprocessing"
depends_on = ["etrafilatura.settings", "etrafilatura.utils", "etrafilatura.xml"]

[[modules]]
path = "etrafilatura.baseline"
depends_on = [
    "etrafilatura.settings",
    "etrafilatura.utils",
    "etrafilatura.xml",
]

[[modules]]
path = "etrafilatura.metadata"
depends_on = [
    "etrafilatura._native",
    "etrafilatura.settings",
    "etrafilatura.source",
    "etrafilatura.utils",
]

[[modules]]
path = "etrafilatura.downloads"
depends_on = ["etrafilatura.settings", "etrafilatura.utils"]

[[modules]]
path = "etrafilatura.core"
depends_on = [
    "etrafilatura.deduplication",
    "etrafilatura.engine",
    "etrafilatura.errors",
    "etrafilatura.htmlprocessing",
    "etrafilatura.metadata",
    "etrafilatura.settings",
    "etrafilatura.source",
    "etrafilatura.utils",
    "etrafilatura.xml",
]

[[modules]]
path = "etrafilatura.cli"
depends_on = [
    "etrafilatura",
    "etrafilatura.core",
    "etrafilatura.downloads",
    "etrafilatura.settings",
]

[[modules]]
path = "etrafilatura.engine"
depends_on = [
    "etrafilatura._native",
    "etrafilatura.baseline",
    "etrafilatura.htmlprocessing",
    "etrafilatura.settings",
    "etrafilatura.utils",
]

[[modules]]
path = "etrafilatura.source"
depends_on = ["etrafilatura.downloads", "etrafilatura.settings", "etrafilatura.utils"]
