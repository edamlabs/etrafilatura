#  tach · architectural import contracts (Rust-backed) · CI: `tach check` (make arch)
#  Layers mirror trafilatura's own module graph: settings/utils/errors (contracts)
#  ← deduplication/xml/htmlprocessing (renderers) ← downloads/baseline/metadata (engines)
#  ← core/cli (use cases) ← rtrafilatura (public surface).

source_roots = ["src"]

exclude = ["tests", "docs"]

forbid_circular_dependencies = true

exact = true

root_module = "forbid"

[rules]
unused_ignore_directives = "error"

[[modules]]
path = "rtrafilatura"
depends_on = [
    "rtrafilatura._native",
    "rtrafilatura.baseline",
    "rtrafilatura.core",
    "rtrafilatura.downloads",
    "rtrafilatura.metadata",
    "rtrafilatura.utils",
]

[[modules]]
path = "rtrafilatura._native"
depends_on = []

[[modules]]
path = "rtrafilatura.errors"
depends_on = []

[[modules]]
path = "rtrafilatura.utils"
depends_on = ["rtrafilatura._native"]

[[modules]]
path = "rtrafilatura.settings"
depends_on = ["rtrafilatura.utils"]

[[modules]]
path = "rtrafilatura.deduplication"
depends_on = ["rtrafilatura.settings", "rtrafilatura.utils"]

[[modules]]
path = "rtrafilatura.xml"
depends_on = ["rtrafilatura.settings", "rtrafilatura.utils"]

[[modules]]
path = "rtrafilatura.htmlprocessing"
depends_on = ["rtrafilatura.settings", "rtrafilatura.utils", "rtrafilatura.xml"]

[[modules]]
path = "rtrafilatura.baseline"
depends_on = [
    "rtrafilatura.settings",
    "rtrafilatura.utils",
    "rtrafilatura.xml",
]

[[modules]]
path = "rtrafilatura.metadata"
depends_on = [
    "rtrafilatura._native",
    "rtrafilatura.settings",
    "rtrafilatura.source",
    "rtrafilatura.utils",
]

[[modules]]
path = "rtrafilatura.downloads"
depends_on = ["rtrafilatura.settings", "rtrafilatura.utils"]

[[modules]]
path = "rtrafilatura.core"
depends_on = [
    "rtrafilatura.deduplication",
    "rtrafilatura.engine",
    "rtrafilatura.errors",
    "rtrafilatura.htmlprocessing",
    "rtrafilatura.metadata",
    "rtrafilatura.settings",
    "rtrafilatura.source",
    "rtrafilatura.utils",
    "rtrafilatura.xml",
]

[[modules]]
path = "rtrafilatura.cli"
depends_on = [
    "rtrafilatura",
    "rtrafilatura.core",
    "rtrafilatura.downloads",
    "rtrafilatura.settings",
]

[[modules]]
path = "rtrafilatura.engine"
depends_on = [
    "rtrafilatura._native",
    "rtrafilatura.baseline",
    "rtrafilatura.htmlprocessing",
    "rtrafilatura.settings",
    "rtrafilatura.utils",
]

[[modules]]
path = "rtrafilatura.source"
depends_on = ["rtrafilatura.downloads", "rtrafilatura.settings", "rtrafilatura.utils"]
