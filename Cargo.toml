[workspace]
resolver = "3"
members = ["crates/native"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/edamlabs/etrafilatura"

[workspace.dependencies]
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py312"] }
trafilatura = { version = "=0.5.0", default-features = false, features = ["markdown"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
